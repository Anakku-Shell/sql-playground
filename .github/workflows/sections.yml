name: Sections

# Fails if sections/ is out of date with sql-guide.md / sql-guide-es.md.
# Runs on every push to any branch (pull requests from this repo are covered
# by the push of their branch).
on:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check:sections
